<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NusantaraID · Character Studio</title><link rel="stylesheet" href="style.css?v=20261020-bow16"></head><body>
<header><a class="brand" href="./"><span class="brand-icon">N</span>Nusantara<span>ID</span></a><span class="tag">CHARACTER STUDIO <b>BETA</b></span></header>
<main>
<div class="workspace"><section class="preview" aria-label="Character preview"><div class="preview-top"><span class="live-dot"></span><span id="look-name">Archer · Male</span><span class="pixel-tag">ORIGINAL SPRITES</span></div><div class="stage" id="stage" tabindex="0" aria-label="Character preview. Swipe left or right to rotate. Swipe up to zoom in, down to zoom out."><canvas id="character" width="800" height="640"></canvas><div id="display-status" role="status"></div><div id="status" role="status">Loading your character…</div><div class="direction"><button id="left" aria-label="Rotate left">←</button><span id="direction" hidden>South</span><button id="right" aria-label="Rotate right">→</button></div><div class="zoom"><button id="plus" aria-label="Zoom in">+</button><input id="zoom" aria-label="Character zoom" aria-orientation="vertical" type="range" min="1" max="8" step="0.25" value="3"><button id="minus" aria-label="Zoom out">−</button><output id="zoom-label">3×</output></div></div></section>
<aside class="controls"><div class="control-tabs" role="tablist" aria-label="Character settings"><button type="button" role="tab" id="style-tab" aria-controls="style-panel" aria-selected="true">Style</button><button type="button" role="tab" id="equipment-tab" aria-controls="equipment-panel" aria-selected="false" tabindex="-1">Equipment</button></div><section class="style-panel" id="style-panel" role="tabpanel" aria-labelledby="style-tab"><label>Gender<select id="gender"><option value="1">Male</option><option value="0">Female</option></select></label><label>Classic job<select id="job"></select></label><label>Hair style<select id="hair"></select></label><label>Hair color<select id="hairColor"></select></label><label>Costume color<select id="costumeColor"></select></label><div class="display-controls"><label>Background<select id="background"><option value="light">Light</option><option value="dark">Dark</option></select></label><label class="aura-toggle"><input type="checkbox" id="aura"> Level 99 aura</label><label id="aura-opacity-control" class="aura-opacity" hidden>Aura opacity <output id="aura-opacity-value" for="aura-opacity">50%</output><input id="aura-opacity" aria-label="Aura opacity" type="range" min="0" max="100" step="5" value="50"></label><label id="aura-size-control" class="aura-opacity" hidden>Aura size <output id="aura-size-value" for="aura-size">100%</output><input id="aura-size" aria-label="Aura size" type="range" min="25" max="200" step="5" value="100"></label></div></section><section class="equipment" id="equipment-panel" role="tabpanel" aria-labelledby="equipment-tab" hidden><div class="equipment-grid"><label>Headgear · upper<select id="upper"></select></label><label>Headgear · middle<select id="middle"></select></label><label>Headgear · lower<select id="lower"></select></label><label>Costume · upper<select id="costumeUpper"></select></label><label>Costume · middle<select id="costumeMiddle"></select></label><label>Costume · lower<select id="costumeLower"></select></label><label>Costume · back / garment<select id="garment"></select></label></div></section><button class="primary" id="export">Save character PNG <span>↗</span></button><button class="reset" id="reset">Reset look</button></aside></div>
</main><script type="module" src="app.js?v=20261020-bow16"></script></body></html>
