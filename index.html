<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NusantaraID · Character Studio</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./"><span class="brand-icon">N</span>Nusantara<span>ID</span></a><span class="tag">CHARACTER STUDIO <b>BETA</b></span></header>
<main>
<div class="workspace"><section class="preview" aria-label="Character preview"><div class="preview-top"><span class="live-dot"></span><span id="look-name">Archer · Male</span><span class="pixel-tag">ORIGINAL SPRITES</span></div><div class="stage" id="stage" tabindex="0" aria-label="Character preview. Scroll or use left and right arrow keys to rotate."><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><canvas id="character" width="800" height="640"></canvas><div id="display-status" role="status"></div><div id="status" role="status">Loading your character…</div><div class="direction"><button id="left" aria-label="Rotate left">←</button><span id="direction">South</span><button id="right" aria-label="Rotate right">→</button></div></div><div class="preview-bottom"><span>↻ <span class="hint">Scroll over character to rotate</span></span><div class="zoom"><button id="minus" aria-label="Zoom out">−</button><input id="zoom" aria-label="Character zoom" type="range" min="1" max="8" step="0.25" value="4"><output id="zoom-label">4×</output><button id="plus" aria-label="Zoom in">+</button></div></div></section>
<aside class="controls"><div class="panel-heading"><span class="eyebrow">MAKE IT YOURS</span><h2>The details</h2></div><label>Gender<select id="gender"><option value="1">Male</option><option value="0">Female</option></select></label><label>Classic job<select id="job"></select></label><label>Hair style<select id="hair"></select></label><label>Hair color<select id="hairColor"></select></label><label>Costume color<select id="costumeColor"></select></label><div class="display-controls"><label>Background<select id="background"><option value="none">No background</option><option value="prontera">Prontera</option><option value="glast_01">Glast Heim</option></select></label><label class="aura-toggle"><input type="checkbox" id="aura"> Level 99 aura</label></div><details class="equipment"><summary>Headgear &amp; costumes</summary><label>Find a visual by name or ID<input id="equipmentSearch" type="search" placeholder="Search equipment…"></label><div class="equipment-grid"><label>Headgear · upper<select id="upper"></select></label><label>Headgear · middle<select id="middle"></select></label><label>Headgear · lower<select id="lower"></select></label><label>Costume · upper<select id="costumeUpper"></select></label><label>Costume · middle<select id="costumeMiddle"></select></label><label>Costume · lower<select id="costumeLower"></select></label><label>Costume · garment / wings<select id="garment"></select></label></div></details><button class="primary" id="export">Save character PNG <span>↗</span></button><button class="reset" id="reset">Reset look</button></aside></div>
</main><script type="module" src="app.js"></script></body></html>
